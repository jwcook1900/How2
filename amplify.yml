version: 1
backend:
  phases:
    build:
      commands:
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands: []
  artifacts:
    # Publish only the static site files (not node_modules / amplify backend).
    # amplify_outputs.json is generated by the backend phase above.
    baseDirectory: /
    files:
      - '*.html'
      - 'favicon.svg'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      # Brand assets (wordmark SVGs referenced by the site headers/footers)
      - 'brand/**/*'
      # Alternative colourway, kept for future use (not referenced anywhere)
      - 'favicon-orange-512.png'
      - 'amplify_outputs.json'
      - 'css/**/*'
      - 'js/**/*'
      - 'images/**/*'
      # Fonts + wasm the share-preview Lambda fetches at cold start
      - 'og-assets/**/*'
  cache:
    paths:
      - 'node_modules/**/*'
