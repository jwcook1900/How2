version: 1
backend:
  phases:
    build:
      commands:
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands: []
  artifacts:
    # Publish only the static site files (not node_modules / amplify backend).
    # amplify_outputs.json is generated by the backend phase above.
    baseDirectory: /
    files:
      - 'index.html'
      - 'builder.html'
      - 'guide.html'
      - 'amplify_outputs.json'
      - 'css/**/*'
      - 'js/**/*'
      - 'images/**/*'
  cache:
    paths:
      - 'node_modules/**/*'
