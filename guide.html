<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Served at pretty paths like /g/<slug>, so resolve assets/links from root. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF6B35" />
  <title>GotIt Guides</title>

  <!-- Social preview (shown when a guide link is shared) -->
  <meta property="og:title" content="A GotIt Guides guide" />
  <meta property="og:description" content="Open this guide — routines, contacts, photos and everything you need, in one link." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.gotitguides.com/images/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.gotitguides.com/images/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <main class="builder-main">
    <div class="container">
      <div class="guide-doc" id="guideDoc">
        <!-- Rendered from localStorage by guide.js -->
      </div>
      <div class="guide-footer" id="guideFooter"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/guide.js"></script>
</body>
</html>
